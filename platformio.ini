[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43

; LilyGO T-Display S3: ST7789, 170x320, 8-bit parallel bus.
; Rotation 1 in the application gives the logical 320x170 display.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:native]
platform = native
platform_packages =
    platformio/toolchain-gccmingw32@1.50100.0
extra_scripts = pre:scripts/native_toolchain.py
build_flags =
    -std=gnu++11
    -DUNITY_SUPPORT_64
    -static
    -static-libgcc
    -static-libstdc++
test_framework = unity
test_build_src = yes
test_testing_command =
    C:\Windows\System32\cmd.exe
    /D
    /C
    scripts\run_native_tests.cmd
build_src_filter =
    +<domain/>
