[platformio]
default_envs = lilygo-main

[esp32_common]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = bodmer/TFT_eSPI@2.5.43

[lilygo_profile]
extends = esp32_common
board = lilygo-t-display-s3
build_flags =
    -DASKOMPU_BOARD_LILYGO_MAIN=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:lilygo-main]
extends = lilygo_profile

; Backwards-compatible alias for existing local commands.
[env:lilygo-t-display-s3]
extends = lilygo_profile

[env:esp32s3-ili9488-main]
extends = esp32_common
board = esp32-s3-devkitc-1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -include include/board/Esp32S3Ili9488Pins.h
    -DASKOMPU_BOARD_ILI9488_MAIN=1
    ; TFT_eSPI 2.5.43 otherwise maps Arduino-ESP32 FSPI=0 directly to an
    ; ESP32-S3 register index. USE_FSPI_PORT selects the correct SPI2 index.
    -DUSE_FSPI_PORT=1
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    ; This panel needs display inversion for neutral whites and full RGB levels.
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    ; Keep full and cropped sprite transfers responsive on the external bus.
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[env:native]
platform = native
platform_packages =
    platformio/toolchain-gccmingw32@1.50100.0
extra_scripts = pre:scripts/native_toolchain.py
build_flags =
    -std=gnu++11
    -DASKOMPU_NATIVE_BUILD
    -DASKOMPU_BOARD_LILYGO_MAIN=1
    -DUNITY_SUPPORT_64
    -static
    -static-libgcc
    -static-libstdc++
test_framework = unity
test_build_src = yes
test_testing_command =
    C:\Windows\System32\cmd.exe
    /D
    /C
    scripts\run_native_tests.cmd
build_src_filter =
    +<domain/>
    +<core/>
    +<route/>
    +<ui/DisplayLayout.cpp>
    +<ui/RouteOrderFormatting.cpp>
    +<input/ButtonInterpreter.cpp>
