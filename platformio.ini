; =============================================================================
; PlatformIO Configuration – LilyGo T-Display S3  (ESP32-S3, ST7789 170×320)
; =============================================================================

[env:lilygo-t-display-s3]
platform  = espressif32
board     = lilygo-t-display-s3
framework = arduino

; ---- Serial / upload ---------------------------------------------------------
monitor_speed  = 115200
upload_speed   = 921600

; ---- Libraries ---------------------------------------------------------------
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ---- TFT_eSPI build-time configuration ---------------------------------------
; These flags replicate the values from Setup206_LilyGo_T_Display_S3.h so the
; build works even if the user forgets to touch User_Setup_Select.h.
; They are injected as compiler defines and take precedence over the library
; header when USER_SETUP_LOADED is defined first.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    ; ---- 8-bit parallel interface (NOT SPI) ----
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; No touch controller on LilyGo T-Display S3 (do not define TOUCH_CS)
    ; Ensure Arduino loop() runs on core 1, keep WiFi/system on core 0
    -DARDUINO_RUNNING_CORE=1
